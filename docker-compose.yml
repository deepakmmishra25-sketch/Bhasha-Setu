version: "3.9"

# ─── BhashaSetu AI — Development Compose ────────────────────────────────────
# Hot-reloads both backend (uvicorn --reload) and frontend (next dev).
# Requires a local .env file or exported env vars with DATABASE_URL etc.
#
# Quick start:
#   cp backend/.env.example .env
#   docker compose up

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhashasetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhashasetu_dev}
      POSTGRES_DB: ${POSTGRES_DB:-bhashasetu}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhashasetu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: deps          # Use deps stage for dev (has all tools)
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bhashasetu}:${POSTGRES_PASSWORD:-bhashasetu_dev}@db:5432/${POSTGRES_DB:-bhashasetu}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: deps          # Use deps stage for dev (node_modules available)
    working_dir: /app
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules   # Preserve container's node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
