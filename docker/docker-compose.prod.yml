version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bhashasetu_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bhashasetu_net

  redis:
    image: redis:7-alpine
    container_name: bhashasetu_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - bhashasetu_net

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
      target: production
    container_name: bhashasetu_backend_prod
    restart: always
    env_file:
      - ../backend/.env.production
    depends_on:
      - postgres
      - redis
    networks:
      - bhashasetu_net
    command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: production
    container_name: bhashasetu_frontend_prod
    restart: always
    env_file:
      - ../frontend/.env.production
    networks:
      - bhashasetu_net

  nginx:
    image: nginx:alpine
    container_name: bhashasetu_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - bhashasetu_net

networks:
  bhashasetu_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
